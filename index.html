<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Privacy Policy – Motmaan App</title>
<style>
    /* Base Styles */
    body {
        font-family: Arial, sans-serif;
        background-color: #f9f9f9;
        color: #333;
        margin: 0;
        padding: 0;
        line-height: 1.6;
    }
    .container {
        max-width: 900px;
        margin: auto;
        padding: 20px;
    }
    h1, h2, h3 { color: #007855; }
    h1 { text-align: center; font-size: 2em; margin-bottom: 0.5em; }
    h2 { font-size: 1.5em; margin-top: 1.2em; }
    h3 { font-size: 1.2em; margin-top: 1em; }
    p, li { font-size: 1em; margin: 0.5em 0; }
    ul { margin-left: 20px; }
    a { color: #007855; text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* Buttons */
    #lang-switch { text-align: center; margin: 20px 0; }
    button {
        padding: 8px 16px;
        margin: 0 5px;
        cursor: pointer;
        background-color: #007855;
        color: #fff;
        border: none;
        border-radius: 5px;
        font-size: 1em;
    }
    button:hover {
        background-color: #005f46;
    }

    /* Responsive adjustments */
    @media (max-width: 600px) {
        body { font-size: 0.95em; }
        h1 { font-size: 1.5em; }
        h2 { font-size: 1.2em; }
        h3 { font-size: 1em; }
        button { font-size: 0.9em; padding: 6px 12px; }
    }
</style>
</head>
<body>
<div class="container">
    <div id="lang-switch">
        <button onclick="setLang('en')">English</button>
        <button onclick="setLang('ar')">العربية</button>
    </div>
    <div id="content"></div>
</div>

<script>

        <p>The policy may be updated occasionally and any changes will be posted on this page.</p>
        <h3>7️⃣ Contact Us</h3>
        <p>For any privacy-related inquiries, contact us at:</p>
        <p>📧 Email: <a href="mailto:ahmedmme.26@gmail.com">ahmedmme.26@gmail.com</a></p>
    `,

function setLang(lang) {
    document.getElementById('content').innerHTML = content[lang];
    document.documentElement.lang = lang;
}

// Default language: English
setLang('en');
</script>
</body>
</html>
